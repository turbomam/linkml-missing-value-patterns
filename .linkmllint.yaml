# linkml-lint configuration for napoleon/. Run with: just lint
extends: recommended
rules:
  # Every class and slot needs a description.
  recommended:
    level: error
  # Every enum value in these schemas is a label a submitter types: INSDC and NCIT terms such as
  # "not applicable: control sample", and local labels such as "physical measurement" and
  # "lost in transit". None can follow snake_case or UPPER_SNAKE, so all enum values are exempt.
  # Class, slot and enum names are still checked.
  standard_naming:
    level: warning
    exclude_type:
      - permissible_value
