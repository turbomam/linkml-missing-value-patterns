# Adds RecommendedSlotsPlugin to the default JSON Schema check. Pass the data file on the command line:
# in linkml 1.11.1 a file listed under data_sources in this config is not read at all.
schema: napoleon/demos/recommended.yaml
target_class: HeightRecord
plugins:
  JsonschemaValidationPlugin:
    closed: true
  RecommendedSlotsPlugin:
