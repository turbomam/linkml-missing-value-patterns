id: https://w3id.org/turbomam/linkml-missing-value-patterns/napoleon/reason_column
name: reason_column
title: "reason-column: an optional height plus a reason column, tied by rules"
description: >-
  height_m stays a float and becomes optional. height_m_missing_reason holds an INSDC term or an asked-and-answered reason. Rules require exactly one of the two.
license: https://creativecommons.org/publicdomain/zero/1.0/
# GENEPIO, NCIT and REC are repeated in each schema, not only in common.yaml, because the Python
# generator behind linkml-convert drops prefixes declared only in an imported schema:
# https://github.com/linkml/linkml/issues/3574
prefixes:
  linkml: https://w3id.org/linkml/
  nap: https://w3id.org/turbomam/linkml-missing-value-patterns/napoleon/
  REC: https://w3id.org/turbomam/linkml-missing-value-patterns/napoleon/record/
  GENEPIO: http://purl.obolibrary.org/obo/GENEPIO_
  NCIT: http://purl.obolibrary.org/obo/NCIT_
default_prefix: nap
default_range: string
imports:
  - linkml:types
  - common

classes:
  HeightRecordSet:
    description: A list of records, so the examples can be written as one table.
    slots: [records]
  HeightRecord:
    tree_root: true
    slots: [record_id, height_m, height_m_missing_reason, source_type]
    rules:
      - title: no_height_requires_a_reason
        preconditions:
          slot_conditions:
            height_m:
              value_presence: ABSENT
        postconditions:
          slot_conditions:
            height_m_missing_reason:
              value_presence: PRESENT
      - title: a_height_forbids_a_reason
        preconditions:
          slot_conditions:
            height_m:
              value_presence: PRESENT
        postconditions:
          slot_conditions:
            height_m_missing_reason:
              value_presence: ABSENT
slots:
  records:
    range: HeightRecord
    multivalued: true
    inlined_as_list: true
  height_m_missing_reason:
    description: Why height_m is absent.
    range: HeightReasonEnum
