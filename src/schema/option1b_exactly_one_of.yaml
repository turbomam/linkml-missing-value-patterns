id: https://w3id.org/turbomam/linkml-missing-value-patterns/option1b
name: option1b_exactly_one_of
title: "Option 1b: the same union written with exactly_one_of"
description: >-
  Identical to option 1 except that the union uses exactly_one_of rather than any_of.
  exactly_one_of is the operator https://github.com/linkml/linkml/issues/178 actually
  proposed, and https://github.com/linkml/linkml/issues/2283 reports that it misbehaves with
  linkml:types ranges. This schema exists so the repository can show what happens rather than
  cite the issue and move on. See docs/findings.md for the measured result.
license: https://creativecommons.org/publicdomain/zero/1.0/

# ENVO, NCIT and SAMP are also declared here, not only in common.yaml, because the Python
# generator behind linkml-convert drops prefixes declared only in an imported schema:
# https://github.com/linkml/linkml/issues/3574
prefixes:
  linkml: https://w3id.org/linkml/
  mvp: https://w3id.org/turbomam/linkml-missing-value-patterns/
  ENVO: http://purl.obolibrary.org/obo/ENVO_
  NCIT: http://purl.obolibrary.org/obo/NCIT_
  SAMP: https://w3id.org/turbomam/linkml-missing-value-patterns/sample/
default_prefix: mvp
default_range: string

imports:
  - linkml:types
  - common

classes:
  BiosampleSet:
    tree_root: true
    description: >-
      A list of samples. It exists so the examples can be written as one table or one graph,
      because linkml-convert needs a container class for tabular output.
    slots:
      - samples

  Biosample:
    slots:
      - sample_id
      - depth_m
      - env_broad_scale
    slot_usage:
      depth_m:
        required: true
        range: Any
        exactly_one_of:
          - range: float
          - range: MissingValueReasonEnum
      env_broad_scale:
        required: true
        range: Any
        exactly_one_of:
          - range: EnvBroadScaleEnum
          - range: MissingValueReasonEnum

slots:
  samples:
    range: Biosample
    multivalued: true
    inlined: true
    inlined_as_list: true
